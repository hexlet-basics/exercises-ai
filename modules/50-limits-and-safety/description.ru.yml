---
name: Ограничения и безопасность
description: |
  ИИ — мощный инструмент, но не всесильный и не всегда правдивый. В этом модуле разберём, где у ассистентов границы: что такое галлюцинации, почему важно проверять факты, какие данные нельзя отправлять и в каких ситуациях ИИ не заменит человека. Эти знания помогут пользоваться ИИ безопасно и с умом.
