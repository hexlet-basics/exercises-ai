name: Знакомство с ИИ-ассистентом
description: |
  Первый модуль — это первый разговор с ИИ. Мы разберём, что такое ИИ-ассистент и большие языковые модели, какие популярные ассистенты существуют и как начать пользоваться ими бесплатно. Каждый урок — это практика: вы общаетесь с ассистентом прямо в уроке и вставляете полученный результат для проверки.
