name: Как написать промт
description: |
  Промт — это запрос к ИИ. От того, как он сформулирован, напрямую зависит результат. В этом модуле мы разберём главные приёмы: как быть конкретным, давать контекст, задавать роль, указывать формат ответа и показывать пример. Это основа, без которой ИИ часто отвечает не то, что вы ожидали.
