---
name: Практические сценарии
description: |
  Теория без практики быстро забывается. В этом модуле — самые частые повседневные задачи, с которыми ИИ помогает каждый день: краткое содержание, перевод, черновики писем, простые объяснения, генерация идей и помощь в учёбе. Эти сценарии пригодятся и в работе, и в жизни.
